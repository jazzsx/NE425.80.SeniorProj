# Nginx reverse-proxy config for the Incident Response Playbook
# Generator. Nginx terminates TLS and is the only thing exposed on
# the LAN; Gunicorn (see gunicorn.conf.py) only ever listens on
# 127.0.0.1 and is never reachable directly.
#
# Not read from this location at runtime -- install it manually:
#
#   sudo cp deploy/nginx/ir-playbook-generator.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/ir-playbook-generator.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Replace "ir-playbook.seniorproj25.local" below with the real
# hostname you'll issue a certificate for (see the README's TLS
# certificate section) -- it must match the certificate's subject/SAN
# and the DNS name lab clients actually use to reach this server.

# ---------------------------------------------------------------
# Stage A: HTTP only. Deploy with just this server block first and
# confirm the app works end-to-end over plain http:// before touching
# TLS at all -- it's much easier to debug Gunicorn/proxy problems
# without also debugging certificates at the same time.
# ---------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ir-playbook.seniorproj25.local;

    # Security headers. X-Frame-Options/frame-ancestors and CSP stop
    # this page from being framed by another site; the app has no
    # inline <script> or <style> tags and loads nothing from another
    # origin, so a strict CSP with no 'unsafe-inline' works cleanly.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ---------------------------------------------------------------
# Stage B: HTTPS, once a certificate from the lab's AD CS Enterprise
# CA is installed (see the README's TLS certificate section for how
# to request/export one -- this config does not invent or embed any
# certificate/key material). To switch over:
#
#   1. Get ssl_certificate/ssl_certificate_key below pointing at the
#      real files (see README for exact paths and permissions).
#   2. Uncomment this whole server block.
#   3. Add "return 301 https://$host$request_uri;" as the only thing
#      inside the HTTP server block's location / above (replacing the
#      proxy_pass), so plain HTTP always redirects to HTTPS.
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. Set SESSION_COOKIE_SECURE=true in the app's environment file
#      and restart the ir-playbook-generator service (see README) --
#      only do this once you've confirmed HTTPS actually works, since
#      a Secure cookie is silently refused by browsers over plain HTTP.
#
# Do NOT add an HSTS header (Strict-Transport-Security) until you've
# completed all of the above and confirmed HTTPS works for every lab
# client -- HSTS tells browsers to refuse plain HTTP to this host
# entirely, for as long as the max-age says, with no easy way to back
# out if something's still wrong with the certificate.
