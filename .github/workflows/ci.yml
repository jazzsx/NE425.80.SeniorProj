name: CI

# Run this workflow whenever code is pushed to main, and whenever a
# pull request targets main. This catches problems both when changes
# land directly and when they're proposed via a PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Run on a fresh Ubuntu virtual machine provided by GitHub.
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.12 is a widely-used, well-supported baseline; 3.14 is the
        # actual version installed on the Ubuntu production server
        # (see the README's Stage 6 deployment section), so testing
        # against it here catches dependency-compatibility problems
        # (e.g. a package needing a newer wheel) before they show up
        # only on the real deployment target.
        python-version: ["3.12", "3.14"]

    steps:
      # Download a copy of the repository's code onto the runner.
      - name: Check out repository
        uses: actions/checkout@v4

      # Install the Python version this job is testing against.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install this project's dependencies, exactly as listed in
      # requirements.txt (which includes Flask and pytest).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run the automated test suite.
      - name: Run tests
        run: python -m pytest
